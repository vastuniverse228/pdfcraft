# Fork-local Windows build. The shared gate in craft-common-actions tests the
# workspace; it does not publish a portable zip a laptop can run without a
# toolchain. This workflow builds the x64 GUI and CLI on windows-latest and
# uploads that zip. It does not sign the binaries and it does not embed
# craft-fonts (Japanese stays a replacement box until a release build).
name: Windows portable

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/windows-cyrillic-everyday-6805
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build the app and the CLI
        shell: pwsh
        run: |
          $env:PDFCRAFT_REQUIRE_WINRES = '1'
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target x86_64-pc-windows-msvc
      - name: Pack the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $null
          $inPkg = $false
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'could not read [workspace.package] version' }
          $bin = 'target\x86_64-pc-windows-msvc\release'
          foreach ($exe in 'pdfcraft.exe', 'pdfcraft-cli.exe') {
            if (-not (Test-Path (Join-Path $bin $exe))) { throw "missing $exe" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "pdfcraft-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $bin 'pdfcraft.exe'), (Join-Path $bin 'pdfcraft-cli.exe') $stage
          foreach ($f in 'README.md', 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE') {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          # Keeps settings, logs and recovery beside the exe instead of AppData.
          Set-Content -Path (Join-Path $stage 'portable.txt') -Value "PdfCraft portable`n" -Encoding ascii
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\pdfcraft-$version-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          Get-Item $zip | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-x64-portable
          path: dist/pdfcraft-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
