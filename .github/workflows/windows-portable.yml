# Fork-local Windows build. The shared gate in craft-common-actions tests the
# workspace; it does not publish a portable zip a laptop can run without a
# toolchain. This workflow builds the x64 GUI and CLI on windows-latest and
# uploads that zip. It does not sign the binaries. It embeds the same
# craft-fonts checkout the release workflow uses, and it ships the Latin
# OCR models plus a Tesseract build with rus+eng.
name: Windows portable

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/windows-cyrillic-everyday-6805
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  # Each push should finish its own zip. Cancelling the previous run drops
  # the artifact the previous commit was meant to publish.
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build the app and the CLI
        shell: pwsh
        run: |
          $env:PDFCRAFT_REQUIRE_WINRES = '1'
          $env:CRAFT_FONTS_DIR = (Resolve-Path 'craft-fonts').Path
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target x86_64-pc-windows-msvc
      - name: Fetch the OCR models
        shell: pwsh
        run: cargo xtask models (Join-Path $env:RUNNER_TEMP 'ocr-models')
      - name: Pack the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $null
          $inPkg = $false
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'could not read [workspace.package] version' }
          $bin = 'target\x86_64-pc-windows-msvc\release'
          foreach ($exe in 'pdfcraft.exe', 'pdfcraft-cli.exe') {
            if (-not (Test-Path (Join-Path $bin $exe))) { throw "missing $exe" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "pdfcraft-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $bin 'pdfcraft.exe'), (Join-Path $bin 'pdfcraft-cli.exe') $stage
          foreach ($f in 'README.md', 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE') {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          # The faces are inside the exe. Their OFL notices travel beside it.
          Get-ChildItem 'craft-fonts\fonts' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $ofl = Join-Path $_.FullName 'OFL.txt'
            if (Test-Path $ofl) { Copy-Item $ofl (Join-Path $stage "OFL-$($_.Name).txt") }
          }
          if (-not (Get-ChildItem (Join-Path $stage 'OFL-*.txt') -ErrorAction SilentlyContinue)) {
            throw 'craft-fonts notices were not staged'
          }
          # Keeps settings, logs and recovery beside the exe instead of AppData.
          Set-Content -Path (Join-Path $stage 'portable.txt') -Value "PdfCraft portable`n" -Encoding ascii
          $models = Join-Path $env:RUNNER_TEMP 'ocr-models'
          foreach ($model in 'text-detection.onnx', 'text-recognition.onnx', 'ATTRIBUTION.txt') {
            if (-not (Test-Path (Join-Path $models $model))) { throw "missing OCR model $model" }
          }
          Copy-Item -Recurse $models (Join-Path $stage 'models')
          # UB-Mannheim's Apache-2.0 Windows build, pinned by SHA-256. Silent NSIS install,
          # then only the program, its DLLs and the tsv config. rus+eng come from tessdata_fast
          # at a pinned commit, also hashed, so the zip does not depend on the installer's pack.
          $setup = Join-Path $env:RUNNER_TEMP 'tesseract-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne 'c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9') {
            throw 'tesseract installer hash mismatch'
          }
          # A short path with no spaces. NSIS reads /D= only when it is last and unquoted;
          # quoting it made the silent install exit without writing tesseract.exe.
          $install = 'C:\tess'
          if (Test-Path $install) { Remove-Item -Recurse -Force $install }
          cmd.exe /c "$setup /S /D=$install"
          $exe = Join-Path $install 'tesseract.exe'
          if (-not (Test-Path $exe)) {
            $fallback = @(
              'C:\Program Files\Tesseract-OCR\tesseract.exe',
              'C:\Program Files (x86)\Tesseract-OCR\tesseract.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($fallback) { $install = Split-Path $fallback; $exe = $fallback }
          }
          if (-not (Test-Path $exe)) {
            Write-Host 'tesseract install directory:'
            if (Test-Path $install) { Get-ChildItem $install -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { $_.FullName } }
            throw 'tesseract installer did not produce tesseract.exe'
          }
          $tess = Join-Path $stage 'tesseract'
          New-Item -ItemType Directory -Force -Path (Join-Path $tess 'tessdata') | Out-Null
          Copy-Item (Join-Path $install 'tesseract.exe') $tess
          Copy-Item (Join-Path $install '*.dll') $tess
          if (-not (Get-ChildItem (Join-Path $tess '*.dll'))) { throw 'tesseract install has no DLLs' }
          if (Test-Path (Join-Path $install 'tessdata\configs')) {
            Copy-Item -Recurse (Join-Path $install 'tessdata\configs') (Join-Path $tess 'tessdata\configs')
          }
          $packs = @{
            'rus.traineddata' = 'e16e5e036cce1d9ec2b00063cf8b54472625b9e14d893a169e2b0dedeb4df225'
            'eng.traineddata' = '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
          }
          $tessdataCommit = '87416418657359cb625c412a48b6e1d6d41c29bd'
          foreach ($name in $packs.Keys) {
            $out = Join-Path $tess "tessdata\$name"
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/$tessdataCommit/$name" -OutFile $out
            if ((Get-FileHash $out -Algorithm SHA256).Hash.ToLower() -ne $packs[$name]) { throw "$name hash mismatch" }
          }
          @(
            'Tesseract OCR (Apache-2.0), Windows build by UB Mannheim.',
            'Installer: https://github.com/UB-Mannheim/tesseract/releases/tag/v5.4.0.20240606',
            'SHA-256: c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9',
            "rus.traineddata and eng.traineddata: https://github.com/tesseract-ocr/tessdata_fast/tree/$tessdataCommit",
            'The app looks for tesseract\tesseract.exe and tesseract\tessdata beside pdfcraft.exe.'
          ) | Set-Content -Path (Join-Path $tess 'NOTICE.txt') -Encoding ascii
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\pdfcraft-$version-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          Get-Item $zip | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-x64-portable
          path: dist/pdfcraft-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
